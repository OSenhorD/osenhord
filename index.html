<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Marques · Portfólio</title>
    <meta name="description" content="Portfólio de David Marques — desenvolvedor full stack. Projetos, experiência e contato." />
    <meta property="og:title" content="David Marques · Portfólio" />
    <meta property="og:description" content="Projetos, experiência e contato." />
    <meta property="og:type" content="website" />
    <script>
      // Aplica o tema antes da renderização para evitar o "flash" de tema claro.
      try {
        const stored = localStorage.getItem('portfolio-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || ((!stored || stored === 'system') && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
